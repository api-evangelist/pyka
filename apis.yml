name: Pyka
description: >-
  Pyka is an Alameda, California company that designs and manufactures large,
  dual-use heavy-lift autonomous electric aircraft for commercial and defense
  operations. Its flagship products are the Pelican 2 autonomous crop-protection
  aircraft for aerial application and the DropShip long-range heavy-lift cargo
  UAS. Pyka builds a fully integrated, vertically owned autonomy stack — an
  Autonomy Engine (real-time OS, sensor fusion, flight control, and path
  planning), a Mission Control operator suite (simulation, communications, and
  operator interface), and custom aerospace-grade hardware. The company is
  backed by DCVC and Obvious Ventures. Pyka does not currently publish a public
  developer API, SDK, or developer portal; this profile captures its public web
  and domain-security footprint. Surfaced via VC portfolio enrichment.
